<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1769C8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monitoring">
<title>Ranking Sales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=202611191800">
<script src="assets/boot.js?v=202611031000"></script>
</head>
<body data-page="rank">

<div class="boot" id="bootBox" role="status">
  <div>
    <p id="bootMsg">Memuat data…</p>
    <div id="bootProg">
      <div class="bar"><i id="bootBar"></i></div>
      <div id="bootEta" class="muted" style="font-size:12px;margin-top:8px"></div>
    </div>
    <div id="bootActions" hidden style="margin-top:14px;display:grid;gap:8px">
      <button type="button" class="btn" id="bootRetry">Coba lagi</button>
      <button type="button" class="btn plain" id="bootOther">Pakai kode lain</button>
    </div>
  </div>
</div>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div class="icon">RK</div>
    <h1>Ranking Sales</h1>
    <p>Peringkat salesman semua DT. Masukkan kode akses tim yang sama dengan Monitoring Harian.</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="codeInput">Kode akses tim</label>
        <input type="text" id="codeInput" autocomplete="off" placeholder="kode akses tim">
      </div>
      <button type="submit" class="btn" id="loginBtn" style="width:100%">Masuk</button>
      <div class="err" id="loginErr" role="alert"></div>
    </form>
    <div data-install hidden></div>
  </div>
</div>

<div id="appScreen" hidden>
  <nav id="tabsNav"></nav>
  <header class="top">
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false" aria-controls="tabsNav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="top-t"><h1 class="top-h" id="greetBig">Ranking</h1><div class="top-s"><span id="csUpdated"></span><span id="csSub"></span></div></div>
    <div class="sync-wrap"><span class="sync ok" id="sync"><i></i><span>Terbaru</span></span><button class="sync-info" id="syncInfo" type="button" aria-label="Arti warna status data">i</button></div>
    <div class="sync-pop" id="syncPop" hidden></div>
    <button class="hdr-btn" id="refreshBtn" type="button" aria-label="Muat ulang data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  </header>
  <div class="banner" id="csBanner" hidden style="margin:12px 16px 0"></div>

  <main>
    <div class="sec" id="dtSec"><div class="chips" id="dtChips" role="group" aria-label="Pilih ruang lingkup"></div></div>
    <div class="card" id="rkCard"></div>
    <div class="card">
      <h2>Akun</h2>
      <p class="hint">Login dibagi dengan Monitoring Harian. Ganti akun / Keluar ada di dasar menu samping.</p>
      <div data-install hidden style="margin-bottom:10px"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/config.js?v=202610311300"></script>
<script src="assets/pwa.js?v=1"></script>
<script src="assets/util.js?v=5"></script>
<script src="assets/status-banner.js?v=3"></script>
<script src="assets/fresh.js?v=202611191600"></script>
<script src="assets/nav.js?v=202611190900"></script>
<script src="assets/rank.js?v=202611191700"></script>
</body>
</html>
