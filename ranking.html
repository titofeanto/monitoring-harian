<body data-page="rank">

<div class="boot" id="bootBox" role="status">
  <div>
    <p id="bootMsg">Memuat data…</p>
    <div id="bootProg">
      <div class="bar"><i id="bootBar"></i></div>
      <div id="bootEta" class="muted" style="font-size:12px;margin-top:8px"></div>
    </div>
    <div id="bootActions" hidden style="margin-top:14px;display:grid;gap:8px">
      <button type="button" class="btn" id="bootRetry">Coba lagi</button>
      <button type="button" class="btn plain" id="bootOther">Pakai kode lain</button>
    </div>
  </div>
</div>

<div class="login-wrap" id="loginScreen">
  <div class="lg-brand">
    <h1 class="lg-name"><img class="lg-logo" src="assets/brand/logo-gelap.png?v=2" width="621" height="444" alt="Jendela Jasper"></h1>

  <div class="lg-main">
    <form id="loginForm" class="lg-form" novalidate>
      <h2 class="lg-title">Ranking Sales</h2>
      <div class="lg-field">
        <label for="codeInput">Kode akses</label>
        <div class="lg-input">
          <input type="password" id="codeInput" name="kode" autocomplete="current-password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="loginErr">
          <button type="button" class="lg-eye" id="codeToggle" aria-controls="codeInput" aria-pressed="false">Tampilkan</button>
        </div>
        <p class="lg-err" id="loginErr" role="alert"></p>
      </div>
      <button type="submit" class="lg-submit" id="loginBtn">Masuk</button>
      <p class="lg-help">Kode dari Deputy Account Manager atau pimpinan DT Anda.</p>
    </form>
    <div data-install hidden></div>
  </div>
</div>

  <main>
    <div class="sec" id="dtSec"><div class="chips" id="dtChips" role="group" aria-label="Pilih ruang lingkup"></div></div>
